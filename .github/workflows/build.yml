name: "Build MSVC 2015 Solution"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install MSVC v140 Toolset
      run: |
        choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.140 --passive --norestart"

    - name: Restore NuGet Packages
      run: nuget restore your-solution-name.sln

    - name: Build Solution
      run: |
        msbuild tag_injector.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v140
